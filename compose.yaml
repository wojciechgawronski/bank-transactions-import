x-backend: &backend
  build:
    context: ./backend
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  env_file: ./backend/.env
  volumes:
    - ./backend:/var/www/html
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *backend
    ports:
      - "8000:8000"

  # Shares ./backend with app, so it reads uploads from storage/app/private.
  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--tries=3"]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gdynia}
      POSTGRES_USER: ${DB_USERNAME:-gdynia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app

volumes:
  db-data:
