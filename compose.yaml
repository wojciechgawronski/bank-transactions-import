services:
  app:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    volumes:
      - ./backend:/var/www/html

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
