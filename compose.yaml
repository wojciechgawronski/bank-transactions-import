x-backend: &backend
  build:
    context: ./backend
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  env_file: ./backend/.env
  volumes:
    - ./backend:/var/www/html
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *backend
    ports:
      - "8000:8000"

  # Shares ./backend with app, so it reads uploads from storage/app/private.
  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--tries=3"]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gdynia}
      POSTGRES_USER: ${DB_USERNAME:-gdynia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional queue backend: docker compose --profile rabbitmq up -d + QUEUE_CONNECTION=rabbitmq.
  # No depends_on from app/queue (optional deps need Compose 2.20+); queue restarts until it connects.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: [rabbitmq]
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional queue backend: docker compose --profile redis up -d + QUEUE_CONNECTION=redis.
  # No host port, so it doesn't clash with a local Redis; use: docker compose exec redis redis-cli
  redis:
    image: redis:7-alpine
    profiles: [redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web GUI for the redis profile; the port is configurable as 8081/8082 are often taken.
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: [redis]
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_GUI_PORT:-8083}:8081"
    depends_on:
      redis:
        condition: service_healthy

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app

volumes:
  db-data:
